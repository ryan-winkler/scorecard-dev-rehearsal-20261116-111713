name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [dev, main, release]
  push:
    branches: [dev, main, release]
    paths:
      - case.txt
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  typecheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate synthetic test outcome
        run: |
          case "$(cat case.txt)" in
            pass) exit 0 ;;
            fail) exit 1 ;;
            cancel) sleep 180 ;;
            *) exit 2 ;;
          esac
  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  ha-core:
    name: Core ${{ matrix.core }}
    strategy:
      matrix:
        core: ["2026.10.4", "2026.11.1"]
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  perf-budgets:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$GITHUB_SHA"
